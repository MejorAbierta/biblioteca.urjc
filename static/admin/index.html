<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager</title>
</head>

<body>

  <script>
    window.CMS_MANUAL_INIT = true;
  </script>

  <!-- Include the script that builds the page and powers Decap CMS -->
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@beta/dist/decap-cms.js"></script>

  <script>
    const basePath = window.location.pathname.replace(/\/admin\/?$/, '');

    const { initCMS } = window;

    initCMS({
      config: {
        public_folder: basePath || '/',
        site_url: window.location.origin + basePath,
        display_url: window.location.origin + basePath
      }
    });
  </script>
</body>

</html>
